[project]
name = "coding-agent"
version = "0.2.0"
description = "Streamlit coding workbench powered by deepagents-code + Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "deepagents-code[ollama]>=0.1.62",
  "streamlit>=1.30",
  "streamlit-antd-components==0.3.2",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
